kind = "web"
previewPath = "/"
title = "VaultMind - Personal Finance Assistant"
version = "1.0.0"
id = "artifacts/vaultmind"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25003

[services.development]
run = "pnpm --filter @workspace/vaultmind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vaultmind", "run", "build" ]
publicDir = "artifacts/vaultmind/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25003"
BASE_PATH = "/"
